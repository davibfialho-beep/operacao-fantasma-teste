<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Operação Fantasma</title>
<style>html,body{margin:0;height:100%;background:#0b0c0e;color:#9aa3ab;font:14px system-ui,sans-serif;display:flex;align-items:center;justify-content:center}</style>
</head>
<body>
<p id="m">Carregando a versão mais recente…</p>
<script>
fetch('latest.txt?t=' + Date.now(), {cache: 'no-store'})
  .then(function (r) { return r.text(); })
  .then(function (v) { location.replace(v.trim() + '/?t=' + Date.now()); })
  .catch(function () { document.getElementById('m').textContent = 'Não foi possível carregar. Recarregue a página.'; });
</script>
</body>
</html>
